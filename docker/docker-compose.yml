# Production/EC2 Docker Compose stack for Real-Time Media Analytics Lakehouse Ingestion.
# All services run continuously on AWS EC2 with automatic restarts.
#
# Usage on EC2:
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml down -v
#
# External Endpoints:
#   Mock API:      http://<EC2_PUBLIC_IP>:8000/health
#   Supervisor UI: http://<EC2_PUBLIC_IP>:8001
#   Kafka UI:      http://<EC2_PUBLIC_IP>:8080
#   Client AI UI:  http://<EC2_PUBLIC_IP>:8050

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    hostname: kafka
    container_name: lakehouse-kafka
    restart: always
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  generator:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lakehouse-generator
    restart: always
    command: python -m generator.synthetic_event_producer --env dev --continuous --interval-seconds 1.0
    environment:
      LAKEHOUSE_ENV: dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  mock_api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lakehouse-mock-api
    restart: always
    command: python -m uvicorn mock_api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      LAKEHOUSE_ENV: dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  client_portal:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: lakehouse-client-portal
    restart: always
    command: python -m validation.genie_client_portal --port 8050
    ports:
      - "0.0.0.0:8050:8050"
    environment:
      DATABRICKS_HOST: "https://dbc-aa73f553-354d.cloud.databricks.com"
      DATABRICKS_TOKEN: "${DATABRICKS_TOKEN}"
      GENIE_SPACE_ID: "01f1a1fd42bf12c9b418f72e196ce123"

  supervisor:
    build:
      context: ..
      dockerfile: supervisor/Dockerfile
    container_name: lakehouse-supervisor
    restart: always
    ports:
      - "0.0.0.0:8001:8001"
    environment:
      DATABRICKS_HOST: "https://dbc-aa73f553-354d.cloud.databricks.com"
      DATABRICKS_TOKEN: "${DATABRICKS_TOKEN}"
      GENIE_SPACE_ID_AUDIENCE: "${GENIE_SPACE_ID_AUDIENCE}"
      GENIE_SPACE_ID_ENGAGEMENT: "${GENIE_SPACE_ID_ENGAGEMENT}"
      GENIE_SPACE_ID_COMPOSITION: "${GENIE_SPACE_ID_COMPOSITION}"
      GENIE_SPACE_ID_MONETIZATION: "${GENIE_SPACE_ID_MONETIZATION}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lakehouse-kafka-ui
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ec2-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  kafka-data:
    driver: local

