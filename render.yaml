# render.yaml
# Render Blueprint configuration file for 1-click free cloud deployment.
# Deploy to Render: https://dashboard.render.com/select-repo?type=blueprint
#
# Free cloud endpoint: https://real-time-media-analytics-api.onrender.com

services:
  - type: web
    name: real-time-media-analytics-api
    env: python
    buildCommand: pip install uv && uv sync --all-extras
    startCommand: uv run uvicorn mock_api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LAKEHOUSE_ENV
        value: dev
      - key: API_TOKEN
        value: dev-bearer-token-local
