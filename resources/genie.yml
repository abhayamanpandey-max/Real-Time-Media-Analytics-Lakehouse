# resources/genie.yml
# Defines the Genie Space deployment documentation and configuration parameters.
#
# KEY DESIGN PRINCIPLE: Genie is only permitted to query the 3 semantic views.
# The small, curated surface area is the primary lever for answer accuracy.
# Do not expose Gold, Silver, or Platinum tables to Genie directly.
#
# Semantic Views exposed to Genie:
#   1. ${var.catalog}.semantic.sem_audience_rankings
#   2. ${var.catalog}.semantic.sem_audience_profile
#   3. ${var.catalog}.semantic.sem_cross_property_comparison

resources:
  # Genie space metadata configuration
  # To link in Databricks Genie UI:
  #   Create Space -> Select 'semantic' schema -> Add tables: sem_audience_rankings, sem_audience_profile, sem_cross_property_comparison
