# resources/workflows.yml
# Defines the Media Analytics Lakehouse pipeline as a Databricks Workflow.
# Schedule: Every 3 hours (0 0 */3 * * ?).
# Tasks run in dependency order: ingest -> silver -> gold -> platinum -> semantic.
# Orchestration uses notebook_task with parameters passed via dbutils.widgets.

resources:
  jobs:
    media_analytics_lakehouse_pipeline:
      name: "[${bundle.target}] Media Analytics Lakehouse Pipeline"
      description: "End-to-end pipeline: API ingestion -> Bronze -> Silver -> Gold -> Platinum -> Semantic"
      
      schedule:
        quartz_cron_expression: "0 0 */3 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED

      # Email notifications on failure
      email_notifications:
        on_failure:
          - REPLACE_WITH_YOUR_EMAIL@example.com

      tasks:
        - task_key: ingest_bronze
          description: "Fetch all events from the analytics API and write to Bronze Delta table"
          notebook_task:
            notebook_path: ../notebooks/01_ingest_bronze.py
          
        - task_key: transform_silver
          description: "Apply all 7 DQ rules, write clean data to Silver, rejections to Quarantine"
          depends_on:
            - task_key: ingest_bronze
          notebook_task:
            notebook_path: ../notebooks/02_silver_transform.py

        - task_key: build_gold
          description: "Build star schema: 5 dimension tables + fact_audience"
          depends_on:
            - task_key: transform_silver
          notebook_task:
            notebook_path: ../notebooks/03_build_gold.py

        - task_key: build_platinum
          description: "Build analytical marts: audience_rankings + audience_profile"
          depends_on:
            - task_key: build_gold
          notebook_task:
            notebook_path: ../notebooks/04_build_platinum.py

        - task_key: build_semantic
          description: "Create semantic SQL views for Databricks Genie AI"
          depends_on:
            - task_key: build_platinum
          notebook_task:
            notebook_path: ../notebooks/05_semantic_views.py

      # Job-level parameters passed to all notebook tasks via dbutils.widgets
      parameters:
        - name: LAKEHOUSE_ENV
          default: "${var.lakehouse_env}"
        - name: API_BASE_URL
          default: "http://13.201.159.64:8000"

      tags:
        project: real-time-media-analytics-lakehouse
        layer: orchestration
        managed_by: databricks_asset_bundles
