[project]
name = "real-time-media-analytics-lakehouse"
version = "0.1.0"
description = "A generalized, end-to-end streaming analytics lakehouse with NL querying via Databricks Genie."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Generator + Kafka producer
    "kafka-python>=2.0.0",
    "pydantic>=2.7.0",
    # Mock API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Ingestion HTTP client
    "requests>=2.32.0",
    # Config
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    # Validation harness & Supervisor
    "python-dotenv>=1.0.0",
    "python-pptx>=1.0.2",
    "mcp>=2.1.1",
]

[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.30.0",
    "databricks-connect>=14.3.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "responses>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["config", "generator", "mock_api", "ingestion", "jobs", "validation", "supervisor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "databricks: marks tests that require a live Databricks Connect session (deselect with -m 'not databricks')",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:starlette",
]

[tool.ruff]
line-length = 120
target-version = "py312"
